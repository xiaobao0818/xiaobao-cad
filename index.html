<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小宝CAD — 智能 CAD 绘图</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23ff8c42'/%3E%3Cpath d='M9 12 L15 7 L23 12 M15 7 V24 M11 17 L21 17' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo" title="小宝CAD">
        <span class="logo-icon">
          <svg viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="6" fill="#ff8c42"/><path d="M9 12 L15 7 L23 12 M15 7 V24 M11 17 L21 17" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="logo-text">小宝<em>CAD</em></span>
      </div>
      <nav id="menubar"></nav>
      <div id="wsSwitch" class="ws-switch">
        <button class="ws-btn active" data-ws="2d" title="二维制图工作区">📐 2D 制图</button>
        <button class="ws-btn" data-ws="3d" title="三维实体建模工作区">🧊 3D 建模</button>
      </div>
      <div class="topbar-right">
        <span id="aiStatus" class="ai-status" title="AI 助手状态">🤖 AI 未配置</span>
        <span id="docTitle" class="doc-title">未命名图纸</span>
      </div>
    </header>

    <div id="toolbar"></div>
    <div id="toolbar3d" style="display:none"></div>

    <main id="main">
      <div id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div id="viewHint" class="view-hint">滚轮缩放 · 按住中键/右键拖动平移 · 命令行输入 L 画线 · 点击右侧 🤖 与 AI 对话创作</div>
      </div>
      <div id="canvas3dWrap" style="display:none">
        <div id="canvas3d"></div>
        <div id="kernelLoading" class="kernel-loading">
          <div class="kl-spinner"></div>
          <div class="kl-text">正在加载三维实体内核 OpenCASCADE（约 63MB，仅首次加载）…</div>
        </div>
      </div>
      <aside id="sidePanel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="ai">🤖 AI 助手</button>
          <button class="tab-btn" data-tab="layers">图层</button>
          <button class="tab-btn" data-tab="props">属性</button>
        </div>
        <div id="tab-ai" class="tab-pane active"></div>
        <div id="tab-layers" class="tab-pane"></div>
        <div id="tab-props" class="tab-pane"></div>
      </aside>
    </main>

    <div id="cmdbar">
      <span id="cmdPrompt">命令:</span>
      <input id="cmdInput" autocomplete="off" spellcheck="false" placeholder="输入命令，如 L、C、REC；输入坐标如 100,50 或 @50&lt;45 …" />
      <button id="cmdOk" title="执行命令">⏎</button>
    </div>
    <div id="statusbar3d" style="display:none">
      <span id="st3dInfo" class="st-item">3D 建模工作区：鼠标左键旋转 · 滚轮缩放 · 右键平移 · 点击实体选择</span>
    </div>
    <footer id="statusbar">
      <span id="stCoords" class="st-item">0.000, 0.000</span>
      <span id="stSnapInfo" class="st-item dim"></span>
      <span class="spacer"></span>
      <span class="st-toggle" id="stOsnap" data-toggle="osnap" title="对象捕捉 (点击切换)">捕捉</span>
      <span class="st-toggle" id="stOrtho" data-toggle="ortho" title="正交模式 F8">正交</span>
      <span class="st-toggle" id="stGrid" data-toggle="grid" title="显示栅格 F7">栅格</span>
      <span class="st-toggle" id="stSnap" data-toggle="gridsnap" title="栅格捕捉">栅格捕捉</span>
      <span id="stLayer" class="st-item" title="当前图层">图层: 0</span>
      <span id="stZoom" class="st-item" title="缩放比例">100%</span>
    </footer>

    <div id="dialogs"></div>
    <div id="toast"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
