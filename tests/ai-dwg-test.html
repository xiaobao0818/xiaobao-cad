<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>小宝CAD DWG 加载实测</title>
<script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<pre id="results" style="position:fixed;top:0;left:0;z-index:9999;background:rgba(0,0,0,.85);color:#7ee08a;font-family:monospace;font-size:11px;padding:8px;max-width:520px;max-height:55vh;overflow:auto">等待加载…</pre>

  <div id="app">
    <header id="topbar">
      <div class="logo" title="小宝CAD">
        <span class="logo-icon">
          <svg viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="6" fill="#ff8c42"/><path d="M9 12 L15 7 L23 12 M15 7 V24 M11 17 L21 17" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="logo-text">小宝<em>CAD</em></span>
      </div>
      <nav id="menubar"></nav>
      <div id="wsSwitch" class="ws-switch">
        <button class="ws-btn active" data-ws="2d" title="二维制图工作区">📐 2D 制图</button>
        <button class="ws-btn" data-ws="3d" title="三维实体建模工作区">🧊 3D 建模</button>
      </div>
      <div class="topbar-right">
        <span id="aiStatus" class="ai-status" title="AI 助手状态">🤖 AI 未配置</span>
        <span id="docTitle" class="doc-title">未命名图纸</span>
      </div>
    </header>

    <div id="toolbar"></div>
    <div id="toolbar3d" style="display:none"></div>

    <main id="main">
      <div id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div id="viewHint" class="view-hint">滚轮缩放 · 按住中键/右键拖动平移 · 命令行输入 L 画线 · 点击右侧 🤖 与 AI 对话创作</div>
      </div>
      <div id="canvas3dWrap" style="display:none">
        <div id="canvas3d"></div>
        <div id="kernelLoading" class="kernel-loading">
          <div class="kl-spinner"></div>
          <div class="kl-text">正在加载三维实体内核 OpenCASCADE（约 63MB，仅首次加载）…</div>
        </div>
      </div>
      <aside id="sidePanel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="ai">🤖 AI 助手</button>
          <button class="tab-btn" data-tab="layers">图层</button>
          <button class="tab-btn" data-tab="props">属性</button>
        </div>
        <div id="tab-ai" class="tab-pane active"></div>
        <div id="tab-layers" class="tab-pane"></div>
        <div id="tab-props" class="tab-pane"></div>
      </aside>
    </main>

    <div id="cmdbar">
      <span id="cmdPrompt">命令:</span>
      <input id="cmdInput" autocomplete="off" spellcheck="false" placeholder="输入命令，如 L、C、REC；输入坐标如 100,50 或 @50&lt;45 …" />
      <button id="cmdOk" title="执行命令">⏎</button>
    </div>
    <div id="statusbar3d" style="display:none">
      <span id="st3dInfo" class="st-item">3D 建模工作区：鼠标左键旋转 · 滚轮缩放 · 右键平移 · 点击实体选择</span>
    </div>
    <footer id="statusbar">
      <span id="stCoords" class="st-item">0.000, 0.000</span>
      <span id="stSnapInfo" class="st-item dim"></span>
      <span class="spacer"></span>
      <span class="st-toggle" id="stOsnap" data-toggle="osnap" title="对象捕捉 (点击切换)">捕捉</span>
      <span class="st-toggle" id="stOrtho" data-toggle="ortho" title="正交模式 F8">正交</span>
      <span class="st-toggle" id="stGrid" data-toggle="grid" title="显示栅格 F7">栅格</span>
      <span class="st-toggle" id="stSnap" data-toggle="gridsnap" title="栅格捕捉">栅格捕捉</span>
      <span id="stLayer" class="st-item" title="当前图层">图层: 0</span>
      <span id="stZoom" class="st-item" title="缩放比例">100%</span>
    </footer>

    <div id="dialogs"></div>
    <div id="toast"></div>
  </div>
  <script type="module" src="/js/app.js"></script>

<script>
const results = [];
const out = () => { document.getElementById('results').textContent = results.join('\n'); };
const log = (x) => { results.push(x); out(); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.setItem('xbcad:ai-settings', JSON.stringify({
  base: 'http://localhost:8898', model: 'mock', key: 'k',
  temperature: 0.2, maxTokens: 4000, useTools: true, autoReview: false, settingsVersion: 2,
}));
(async () => {
  for (let i = 0; i < 400 && !(window.CAD && window.CAD.scene); i++) await wait(50);
  const CAD = window.CAD;
  for (let i = 0; i < 200 && !window.__aiPanel; i++) await wait(50);
  if (CAD.app._autosaveTimer) clearInterval(CAD.app._autosaveTimer);
  const panel = window.__aiPanel;
  log('app: ' + !!(CAD && CAD.scene) + ' panel: ' + !!panel);
  // 1) 打开 DWG 到图纸（文件→打开流程）
  try {
    const resp = await fetch('/samples/sample_example_2007.dwg');
    const buf = await resp.arrayBuffer();
    const file = new File([buf], 'example_2007.dwg', { type: 'application/dwg' });
    const r = await (async () => {
      const mod = await import('/js/io.js');
      return mod.openFile(CAD.app, file);
    })();
    log('打开 DWG: ' + (r.type === 'dwg' && CAD.scene.count() > 30 ? 'OK（图纸加载 ' + CAD.scene.count() + ' 个实体）' : 'FAIL'));
    const layers = [...CAD.scene.layers.keys()];
    log('DWG 图层: ' + (layers.length >= 2 ? 'OK（' + layers.length + ' 个: ' + layers.slice(0, 5).join('/') + '）' : 'FAIL'));
    const types = {};
    for (const e of CAD.scene.all()) types[e.type] = (types[e.type] || 0) + 1;
    log('实体类型: ' + JSON.stringify(types));
  } catch (e) {
    log('打开 DWG 失败: ' + (e?.message || e));
  }
  // 2) AI 参考文件：附加 DWG → 解析并给模型信息
  try {
    const resp = await fetch('/samples/sample_example_2007.dwg');
    const buf = await resp.arrayBuffer();
    const file = new File([buf], '参考图.dwg', { type: 'application/dwg' });
    await panel._attachFile(file);
    const entry = panel.fileContexts.find((e) => e.ext === 'dwg');
    const okEntry = entry && entry.count >= 30 && entry.summary.includes('实体总数');
    const msg = panel.messages.find((m) => m.role === 'user' && typeof m.content === 'string' && m.content.includes('本软件已解析该 DWG'));
    log('AI 参考 DWG: ' + (okEntry ? 'OK（' + entry.count + ' 个实体已解析）' : 'FAIL'));
    log('AI 上下文注入: ' + (msg ? 'OK（告知模型直接使用解析结果）' : 'FAIL'));
    log('摘要预览: ' + (entry?.summary || '').split('\n').slice(0, 3).join(' | '));
  } catch (e) {
    log('AI 参考 DWG 失败: ' + (e?.stack ? e.stack.split('\n')[0] : e));
  }
  // 3) 图纸加载后可截图（多模态审阅可用）
  const img = CAD.captureForAI();
  log('截图能力: ' + (img && img.startsWith('data:image/png') ? 'OK' : 'FAIL'));
  const dwgOpened = CAD.scene.count() > 30;
  const entryOk = panel.fileContexts.some((e) => e.ext === 'dwg' && e.count >= 30);
  const msgOk = panel.messages.some((m) => m.role === 'user' && typeof m.content === 'string' && m.content.includes('本软件已解析该 DWG'));
  log((dwgOpened && entryOk && msgOk) ? 'AI_DWG_PASS' : 'AI_DWG_FAIL');
  out();
})();

</script>
</body>
</html>
