<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>STEP 读写验证</title></head>
<body style="background:#111;color:#eee;font-family:monospace;padding:16px">
<pre id="out">加载中…</pre>
<script type="module">
const out = [];
const flush = () => { document.getElementById('out').textContent = out.join('\n'); };
const factory = (await import('/node_modules/opencascade.js/dist/opencascade.wasm.js')).default;
const oc = await factory({ locateFile: (f) => '/node_modules/opencascade.js/dist/' + f });
try {
  const boxShape = new oc.BRepPrimAPI_MakeBox_1(10, 20, 30).Shape();
  // 写
  const w = new oc.STEPControl_Writer_1();
  out.push('Transfer = ' + JSON.stringify(w.Transfer(boxShape, 1, true)));
  const wr = w.Write('xbcad.step');
  out.push('Write 返回 = ' + JSON.stringify(wr) + ' typeof=' + typeof wr + (wr && wr.value !== undefined ? ' value=' + wr.value : ''));
  out.push('/ 目录: ' + oc.FS.readdir('/').join(','));
  let bytes = null;
  try { bytes = oc.FS.readFile('/xbcad.step'); out.push('文件存在: ' + bytes.length + ' 字节'); }
  catch (e) { out.push('文件不存在!'); }
  out.push('文件头: ' + (bytes ? new TextDecoder().decode(bytes.slice(0, 40)).replace(/\n/g, ' ') : 'n/a'));

  // 读
  const r = new oc.STEPControl_Reader_1();
  const rd = r.ReadFile('xbcad.step');
  out.push('ReadFile 返回 = ' + JSON.stringify(rd) + ' typeof=' + typeof rd + (rd && rd.value !== undefined ? ' value=' + rd.value : ''));
  const nb = r.TransferRoots();
  out.push('TransferRoots = ' + nb);
  const one = r.OneShape();
  out.push('OneShape = ' + (one ? 'yes' : 'null'));
  if (one) {
    const props = new oc.GProp_GProps_1();
    oc.BRepGProp.VolumeProperties_1(one, props, 1e-5, false, false);
    out.push('回读体积 = ' + props.Mass());
  }
  // 多根情况
  out.push('NbRootsForTransfer = ' + r.NbRootsForTransfer());
} catch (e) {
  out.push('FATAL: ' + (e?.stack ? e.stack.split('\n').slice(0, 4).join(' | ') : e));
}
out.push('STEPTEST_DONE'); flush();
</script>
</body>
</html>
