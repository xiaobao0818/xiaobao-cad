<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>小宝CAD AI 多模态审阅实测</title>
<script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<pre id="results" style="position:fixed;top:0;left:0;z-index:9999;background:rgba(0,0,0,.85);color:#7ee08a;font-family:monospace;font-size:11px;padding:8px;max-width:520px;max-height:55vh;overflow:auto">等待加载…</pre>

  <div id="app">
    <header id="topbar">
      <div class="logo" title="小宝CAD">
        <span class="logo-icon">
          <svg viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="6" fill="#ff8c42"/><path d="M9 12 L15 7 L23 12 M15 7 V24 M11 17 L21 17" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="logo-text">小宝<em>CAD</em></span>
      </div>
      <nav id="menubar"></nav>
      <div id="wsSwitch" class="ws-switch">
        <button class="ws-btn active" data-ws="2d" title="二维制图工作区">📐 2D 制图</button>
        <button class="ws-btn" data-ws="3d" title="三维实体建模工作区">🧊 3D 建模</button>
      </div>
      <div class="topbar-right">
        <span id="aiStatus" class="ai-status" title="AI 助手状态">🤖 AI 未配置</span>
        <span id="docTitle" class="doc-title">未命名图纸</span>
      </div>
    </header>

    <div id="toolbar"></div>
    <div id="toolbar3d" style="display:none"></div>

    <main id="main">
      <div id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div id="viewHint" class="view-hint">滚轮缩放 · 按住中键/右键拖动平移 · 命令行输入 L 画线 · 点击右侧 🤖 与 AI 对话创作</div>
      </div>
      <div id="canvas3dWrap" style="display:none">
        <div id="canvas3d"></div>
        <div id="kernelLoading" class="kernel-loading">
          <div class="kl-spinner"></div>
          <div class="kl-text">正在加载三维实体内核 OpenCASCADE（约 63MB，仅首次加载）…</div>
        </div>
      </div>
      <aside id="sidePanel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="ai">🤖 AI 助手</button>
          <button class="tab-btn" data-tab="layers">图层</button>
          <button class="tab-btn" data-tab="props">属性</button>
        </div>
        <div id="tab-ai" class="tab-pane active"></div>
        <div id="tab-layers" class="tab-pane"></div>
        <div id="tab-props" class="tab-pane"></div>
      </aside>
    </main>

    <div id="cmdbar">
      <span id="cmdPrompt">命令:</span>
      <input id="cmdInput" autocomplete="off" spellcheck="false" placeholder="输入命令，如 L、C、REC；输入坐标如 100,50 或 @50&lt;45 …" />
      <button id="cmdOk" title="执行命令">⏎</button>
    </div>
    <div id="statusbar3d" style="display:none">
      <span id="st3dInfo" class="st-item">3D 建模工作区：鼠标左键旋转 · 滚轮缩放 · 右键平移 · 点击实体选择</span>
    </div>
    <footer id="statusbar">
      <span id="stCoords" class="st-item">0.000, 0.000</span>
      <span id="stSnapInfo" class="st-item dim"></span>
      <span class="spacer"></span>
      <span class="st-toggle" id="stOsnap" data-toggle="osnap" title="对象捕捉 (点击切换)">捕捉</span>
      <span class="st-toggle" id="stOrtho" data-toggle="ortho" title="正交模式 F8">正交</span>
      <span class="st-toggle" id="stGrid" data-toggle="grid" title="显示栅格 F7">栅格</span>
      <span class="st-toggle" id="stSnap" data-toggle="gridsnap" title="栅格捕捉">栅格捕捉</span>
      <span id="stLayer" class="st-item" title="当前图层">图层: 0</span>
      <span id="stZoom" class="st-item" title="缩放比例">100%</span>
    </footer>

    <div id="dialogs"></div>
    <div id="toast"></div>
  </div>
  <script type="module" src="/js/app.js"></script>

<script>
const results = [];
const out = () => { document.getElementById('results').textContent = results.join('\n'); };
const log = (x) => { results.push(x); out(); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.setItem('xbcad:ai-settings', JSON.stringify({
  base: 'http://localhost:8898', model: 'mock-water-pump', key: 'test-key-123',
  temperature: 0.2, maxTokens: 4000, useTools: true, autoReview: false,
  visionBase: 'http://localhost:8898', visionModel: 'MiniMax-M3', visionKey: '',
  reviewRounds: 0, deepThink: false,
}));
(async () => {
  for (let i = 0; i < 400 && !(window.CAD && window.CAD.scene); i++) await wait(50);
  const CAD = window.CAD;
  log('app: ' + !!(CAD && CAD.scene));
  if (CAD.app._autosaveTimer) clearInterval(CAD.app._autosaveTimer);
  CAD.app.showWorkspace('3d');
  for (let i = 0; i < 200 && !CAD.app3d; i++) await wait(50);
  CAD.app3d?.ensureLoaded();
  try { await CAD.app3d?.readyPromise; } catch (e) { log('kernel fail: ' + (e?.message || e)); }
  log('kernel: ' + !!CAD.app3d?.ready);
  const panel = window.__aiPanel;
  if (!panel || !CAD.app3d?.ready) { log('AI_REVIEW_FAIL'); out(); return; }
  // 先验证截图能力
  const img = CAD.captureForAI();
  log('截图能力: ' + (img && img.startsWith('data:image/png') ? 'OK (' + img.length + ' 字符)' : 'FAIL'));
  // 1) 正常创作（水泵剧本，无自动审阅）
  panel.ask('请绘制一个水泵的三维模型：底座、泵壳、进出水法兰。');
  for (let i = 0; i < 600; i++) {
    await wait(200);
    const f = panel.messages.some((m) => m.role === 'assistant' && /水泵三维模型已完成/.test(m.content || ''));
    if (f && !panel._busy) break;
  }
  const m = CAD.app3d.model;
  log('创作完成: 特征=' + m.count() + ' 可见=' + m.visibleCount());
  // 2) 手动触发多模态审阅
  panel._manualReview();
  let reviewed = false;
  for (let i = 0; i < 600; i++) {
    await wait(200);
    const ok = panel.messages.some((msg) => msg.role === 'assistant' && /已满意/.test(msg.content || ''));
    if (ok && !panel._busy) { reviewed = true; break; }
  }
  log('审阅完成: ' + reviewed);
  // 3) 验证审阅过程：消息里带图片、模型被修改
  const hasImage = panel.messages.some((msg) => msg.role === 'user' && Array.isArray(msg.content) &&
    msg.content.some((c) => c.type === 'image_url' && (c.image_url?.url || '').startsWith('data:image/png')));
  log('审阅消息带截图: ' + (hasImage ? 'OK' : 'FAIL'));
  const hasMark = panel.messages.some((msg) => msg.role === 'user' && Array.isArray(msg.content) &&
    msg.content.some((c) => c.type === 'text' && /多模态审阅/.test(c.text || '')));
  log('审阅提示词: ' + (hasMark ? 'OK' : 'FAIL'));
  log('审阅后特征数: ' + m.count() + ' (期望 7：原 6 + 审阅加的垫圈)');
  const bubbles = [...document.querySelectorAll('.ai-msg.assistant .ai-bubble')].map((el) => el.textContent);
  const lastMsg = bubbles[bubbles.length - 1] || '';
  log('审阅结论: ' + lastMsg.slice(0, 50).replace(/\n/g, ' '));
  // 4) 自动审阅路径：再问一次带修改的任务，应自动触发审阅
  const reviewBefore = panel.messages.filter((msg) => msg.role === 'user' && Array.isArray(msg.content) &&
    msg.content.some((c) => c.type === 'text' && /多模态审阅/.test(c.text || ''))).length;
  log('诊断: 审阅消息基线=' + reviewBefore);
  panel.settings.autoReview = true; // 动态启用自动审阅
  panel.ask('再给模型加一个小零件。');
  let autoReviewed = false;
  let lastN = reviewBefore;
  for (let i = 0; i < 800; i++) {
    await wait(200);
    const n = panel.messages.filter((msg) => msg.role === 'user' && Array.isArray(msg.content) &&
      msg.content.some((c) => c.type === 'text' && /多模态审阅/.test(c.text || ''))).length;
    if (n !== lastN) { log('诊断: 审阅消息数 ' + lastN + ' → ' + n + ' (busy=' + panel._busy + ')'); lastN = n; }
    if (n > reviewBefore && !panel._busy) { autoReviewed = true; break; }
  }
  const addedPart = panel.messages.some((m) => m.role === 'assistant' && /已添加小零件/.test(m.content || ''));
  log('诊断: 小零件已添加=' + addedPart + ' busy=' + panel._busy);
  log('自动审阅触发: ' + (autoReviewed ? 'OK' : 'FAIL'));
  // DWG 参考文件附加测试（真实 DWG 文件，LibreDWG 解析）
  const dwgResp = await fetch('/samples/sample_example_2007.dwg');
  const dwgFile = new File([await dwgResp.arrayBuffer()], '平面图.dwg', { type: 'application/dwg' });
  await panel._attachFile(dwgFile);
  const dwgEntry = panel.fileContexts.find((e) => e.ext === 'dwg');
  const dwgOk = !!(dwgEntry && dwgEntry.count >= 30 && dwgEntry.summary.includes('实体总数'));
  const dwgMsg = panel.messages.some((m) => m.role === 'user' && typeof m.content === 'string' && m.content.includes('[参考文件] 平面图.dwg'));
  log('DWG 参考文件: ' + (dwgOk && dwgMsg ? 'OK（解析 ' + dwgEntry.count + ' 个实体）' : 'FAIL'));
  log('DWG 摘要预览: ' + (dwgEntry?.summary || '').split('\n').slice(0, 2).join(' | '));
  const ok = reviewed && hasImage && hasMark && m.count() >= 8 && lastMsg.includes('已满意') && autoReviewed && dwgOk && dwgMsg;
  log(ok ? 'AI_REVIEW_PASS' : 'AI_REVIEW_FAIL');
  out();
})();

</script>
</body>
</html>
